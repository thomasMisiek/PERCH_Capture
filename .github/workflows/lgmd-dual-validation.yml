name: Validate paired frame-based and DVS ON/OFF LGMD models
on:
  push:
    paths:
      - 'src/lgmd_dual_polarity.py'
      - 'tests/test_lgmd_dual_polarity.py'
      - '.github/workflows/lgmd-dual-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  polarity-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model dependencies
        run: python -m pip install numpy opencv-python-headless
      - name: Check bright ON, dark OFF and static negative controls
        run: python -m unittest discover -s tests -p 'test_lgmd_dual_polarity.py' -v
