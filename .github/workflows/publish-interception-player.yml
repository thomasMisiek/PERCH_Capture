name: Publish README interception player

on:
  push:
    paths:
      - '.github/workflows/publish-interception-player.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Upload 40 FPS video as a GitHub media attachment
        id: attach
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          issue_url="$(gh issue create --title 'README media upload: PERCH interception (40 FPS)' --body 'This issue holds the GitHub video asset embedded in the project README.' --attach media/PERCH_INTERCEPTION_MOSQUITO_40fps.mp4)"
          issue_number="${issue_url##*/}"
          issue_body="$(gh issue view "$issue_number" --json body --jq .body)"
          asset_url="$(printf '%s\n' "$issue_body" | grep -oE 'https://github.com/user-attachments/assets/[A-Za-z0-9-]+' | head -n 1 || true)"
          if [[ -z "$asset_url" ]]; then
            echo "No GitHub-hosted video attachment URL was returned" >&2
            exit 1
          fi
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Update README to display 40 FPS video
        env:
          VIDEO_URL: ${{ steps.attach.outputs.asset_url }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          file = Path('README.md')
          content = file.read_text(encoding='utf-8')
          old = '''## Latest interception simulation

          [**Watch the latest mosquito interception simulation (MP4, 20.4 MB)**](media/PERCH_INTERCEPTION_MOSQUITO.mp4) · [Open video directly](https://raw.githubusercontent.com/thomasMisiek/PERCH_Capture/main/media/PERCH_INTERCEPTION_MOSQUITO.mp4)

          '''
          new = '''## Latest interception simulation

          ''' + os.environ['VIDEO_URL'] + '''

          [**Download the original 144 FPS MP4 (20.4 MB)**](https://raw.githubusercontent.com/thomasMisiek/PERCH_Capture/main/media/PERCH_INTERCEPTION_MOSQUITO.mp4)

          '''
          if old not in content:
            raise SystemExit("The expected README video section has changed; nothing will be overwritten.")
          file.write_text(content.replace(old,new,1),encoding='utf-8')
          PY

      - name: Commit README only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Embed GitHub-hosted 40 FPS interception video and link original 144 FPS version"
          git push

      - name: Close upload issue
        if: always() && steps.attach.outputs.issue_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.attach.outputs.issue_number }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment "Video asset uploaded for use in the README." || true
